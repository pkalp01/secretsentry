# Chat apps, webhooks and email services.

- id: slack-token
  label: Slack token
  category: messaging
  confidence: high
  keywords: [xox]
  pattern: '\b(xox[abeprs]-[0-9A-Za-z\-]{10,250})'
  minEntropy: 3.0
  placeholder: SLACK_TOKEN
  description: Known Slack format (xoxb-, xoxp- and related)
  tests:
    match:
      - 'SLACK_BOT_TOKEN=xoxb-<<digits:12>>-<<digits:13>>-<<alnum:24>>'
    nomatch:
      - 'xoxb-123'

- id: slack-webhook
  label: Slack webhook URL
  category: messaging
  confidence: high
  keywords: [hooks.slack.com]
  pattern: '(https://hooks\.slack\.com/services/T[A-Z0-9]{6,12}/B[A-Z0-9]{6,12}/[A-Za-z0-9]{20,32})'
  placeholder: SLACK_WEBHOOK
  description: Anyone with this URL can post to your Slack channel
  tests:
    match:
      - 'curl -X POST https://hooks.slack.com/services/T<<b32:9>>/B<<b32:9>>/<<alnum:24>>'
    nomatch:
      - 'https://hooks.slack.com/services/'

- id: discord-webhook
  label: Discord webhook URL
  category: messaging
  confidence: high
  keywords: [discord]
  pattern: '(https://(?:ptb\.|canary\.)?discord(?:app)?\.com/api/webhooks/\d{17,20}/[A-Za-z0-9_\-]{60,80})'
  placeholder: DISCORD_WEBHOOK
  description: Anyone with this URL can post to your Discord channel
  tests:
    match:
      - 'https://discord.com/api/webhooks/<<digits:18>>/<<urlsafe:68>>'
    nomatch:
      - 'https://discord.com/api/webhooks/'

- id: telegram-bot-token
  label: Telegram bot token
  category: messaging
  confidence: high
  keywords: [':aa']
  pattern: '\b(\d{8,10}:AA[A-Za-z0-9_\-]{33})(?![A-Za-z0-9_\-])'
  placeholder: TELEGRAM_BOT_TOKEN
  description: Known Telegram bot token format (bot id, then :AA)
  tests:
    match:
      - 'bot = Bot("<<digits:10>>:AA<<urlsafe:33>>")'
    nomatch:
      - '12:AA<<urlsafe:33>>'

- id: sendgrid-api-key
  label: SendGrid API key
  category: messaging
  confidence: high
  keywords: [sg.]
  pattern: '\b(SG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43})(?![A-Za-z0-9_\-])'
  placeholder: SENDGRID_API_KEY
  description: Known SendGrid format (SG. plus two segments)
  tests:
    match:
      - 'SENDGRID_API_KEY=SG.<<urlsafe:22>>.<<urlsafe:43>>'
    nomatch:
      - 'SG.<<urlsafe:10>>'

- id: twilio-api-key
  label: Twilio API key
  category: messaging
  confidence: medium
  keywords: [sk]
  pattern: '\b(SK[0-9a-f]{32})\b'
  minEntropy: 3.0
  placeholder: TWILIO_API_KEY
  description: Matches the Twilio API key format (SK plus 32 hex characters)
  tests:
    match:
      - 'TWILIO_API_KEY=SK<<hex:32>>'
    nomatch:
      - 'SK<<hex:10>>'

- id: mailgun-api-key
  label: Mailgun API key
  category: messaging
  confidence: medium
  keywords: [key-]
  pattern: '\b(key-[0-9a-f]{32})\b'
  minEntropy: 3.0
  placeholder: MAILGUN_API_KEY
  description: Matches the Mailgun key format (key- plus 32 hex characters)
  tests:
    match:
      - 'auth=("api", "key-<<hex:32>>")'
    nomatch:
      - 'primary-key-id'
