# Code hosting and package registries.

- id: github-token
  label: GitHub token
  category: code
  confidence: high
  keywords: [ghp_, gho_, ghu_, ghs_, ghr_]
  pattern: '\b(gh[pousr]_[A-Za-z0-9]{36})\b'
  validate: github-checksum
  placeholder: GITHUB_TOKEN
  description: Known GitHub format (ghp_, gho_, ghu_, ghs_ or ghr_ plus 36 characters)
  tests:
    match:
      - 'git clone https://<<ghtoken:ghp_>>@github.com/me/repo.git'
      - 'token: <<ghtoken:gho_>>'
    nomatch:
      - 'ghp_<<alnum:20>>'
      - 'ghx_<<alnum:36>>'

- id: github-fine-grained-pat
  label: GitHub fine-grained token
  category: code
  confidence: high
  keywords: [github_pat_]
  pattern: '\b(github_pat_[A-Za-z0-9]{22}_[A-Za-z0-9]{59})\b'
  placeholder: GITHUB_TOKEN
  description: Known GitHub fine-grained token format (github_pat_)
  tests:
    match:
      - 'GH_TOKEN=github_pat_<<alnum:22>>_<<alnum:59>>'
    nomatch:
      - 'github_pat_<<alnum:22>>'

- id: gitlab-token
  label: GitLab token
  category: code
  confidence: high
  keywords: [glpat-, gldt-, glrt-]
  pattern: '\b(gl(?:pat|dt|rt)-[A-Za-z0-9_\-]{20,64})(?![A-Za-z0-9_\-])'
  placeholder: GITLAB_TOKEN
  description: Known GitLab format (glpat- and related prefixes)
  tests:
    match:
      - 'CI_TOKEN=glpat-<<urlsafe:20>>'
    nomatch:
      - 'glpat-<<urlsafe:8>>'

- id: npm-token
  label: npm access token
  category: code
  confidence: high
  keywords: [npm_]
  pattern: '\b(npm_[A-Za-z0-9]{36})\b'
  placeholder: NPM_TOKEN
  description: Known npm format (npm_ plus 36 characters)
  tests:
    match:
      - '//registry.npmjs.org/:_authToken=npm_<<alnum:36>>'
    nomatch:
      - 'npm_<<alnum:12>>'
      - 'npm_config_cache=/tmp/cache'

- id: pypi-token
  label: PyPI upload token
  category: code
  confidence: high
  keywords: [pypi-ageichlwas5vcmc]
  pattern: '\b(pypi-AgEIcHlwaS5vcmc[A-Za-z0-9_\-]{50,300})'
  placeholder: PYPI_TOKEN
  description: Known PyPI token format (pypi-AgEIcHlwaS5vcmc...)
  tests:
    match:
      - 'password = pypi-AgEIcHlwaS5vcmc<<urlsafe:80>>'
    nomatch:
      - 'pypi-AgEIcHlwaS5vcmc<<urlsafe:10>>'
