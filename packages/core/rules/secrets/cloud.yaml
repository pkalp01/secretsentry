# Cloud provider credentials.
# Test strings use <<kind:N>> fillers, which tests expand into random fake values
# at runtime. This keeps real-looking keys out of the repo (and out of GitHub
# push protection's way). Kinds: alnum, hex, b64, b32, urlsafe, digits, ghtoken.

- id: aws-access-key-id
  label: AWS access key ID
  category: cloud
  confidence: high
  keywords: [akia, asia, abia, acca]
  pattern: '\b((?:AKIA|ASIA|ABIA|ACCA)[A-Z2-7]{16})\b'
  placeholder: AWS_ACCESS_KEY_ID
  description: Known AWS format (AKIA or ASIA plus 16 characters)
  tests:
    match:
      - 'AWS_ACCESS_KEY_ID=AKIA<<b32:16>>'
      - 'temporary key ASIA<<b32:16>> expires in an hour'
    nomatch:
      - 'AKIA<<b32:12>>'
      - 'XAKIA<<b32:16>>'

- id: aws-secret-access-key
  label: AWS secret access key
  category: cloud
  confidence: high
  keywords: [aws, amazon]
  flags: i
  pattern: '(?:aws|amazon)[\w\-]{0,30}?(?:secret|sk)[\w\-]{0,30}?["'']?\s*(?:=|:|=>)\s*["'']?([A-Za-z0-9/+]{40})(?![A-Za-z0-9/+])'
  minEntropy: 3.5
  placeholder: AWS_SECRET_ACCESS_KEY
  description: 40-character value assigned to an AWS secret key name
  tests:
    match:
      - 'aws_secret_access_key = <<b64:40>>'
      - '"AWS_SECRET_ACCESS_KEY": "<<b64:40>>"'
    nomatch:
      - 'aws_secret_access_key = <<b64:30>>'
      - 'aws_region = <<b64:40>>'

- id: gcp-api-key
  label: Google API key
  category: cloud
  confidence: high
  keywords: [aiza]
  pattern: '\b(AIza[0-9A-Za-z_\-]{35})(?![0-9A-Za-z_\-])'
  placeholder: GOOGLE_API_KEY
  description: Known Google format (AIza plus 35 characters). Also used for Gemini and Firebase
  tests:
    match:
      - 'GEMINI_API_KEY=AIza<<urlsafe:35>>'
    nomatch:
      - 'AIza<<urlsafe:20>>'

- id: gcp-service-account-key-id
  label: Google service account key
  category: cloud
  confidence: high
  keywords: [private_key_id]
  pattern: '"private_key_id"\s*:\s*"([a-f0-9]{40})"'
  placeholder: GCP_PRIVATE_KEY_ID
  description: Service account JSON file (the private key itself is flagged separately)
  tests:
    match:
      - '{"type": "service_account", "private_key_id": "<<hex:40>>"}'
    nomatch:
      - '"private_key_id": "<<hex:20>>"'

- id: azure-storage-account-key
  label: Azure storage account key
  category: cloud
  confidence: high
  keywords: [accountkey]
  pattern: 'AccountKey=([A-Za-z0-9+/]{86}==)'
  placeholder: AZURE_STORAGE_KEY
  description: Azure Storage connection string with an account key
  tests:
    match:
      - 'DefaultEndpointsProtocol=https;AccountName=demo;AccountKey=<<b64:86>>==;EndpointSuffix=core.windows.net'
    nomatch:
      - 'AccountKey=<<b64:40>>=='

- id: azure-entra-client-secret
  label: Microsoft Entra client secret
  category: cloud
  confidence: high
  keywords: ['q~']
  pattern: '(?<![A-Za-z0-9_~.\-])([A-Za-z0-9_~.]{3}\dQ~[A-Za-z0-9_~.\-]{31,34})(?![A-Za-z0-9_~.\-])'
  minEntropy: 3.5
  placeholder: ENTRA_CLIENT_SECRET
  description: Known Entra ID (Azure AD) app secret format (3 characters, a digit, then Q~)
  tests:
    match:
      - 'client_secret: abc8Q~<<urlsafe:34>>'
    nomatch:
      - 'abc8Q~<<urlsafe:10>>'

- id: digitalocean-token
  label: DigitalOcean token
  category: cloud
  confidence: high
  keywords: [dop_v1_, doo_v1_, dor_v1_]
  pattern: '\b(do[opr]_v1_[a-f0-9]{64})\b'
  placeholder: DIGITALOCEAN_TOKEN
  description: Known DigitalOcean format (dop_v1_ plus 64 hex characters)
  tests:
    match:
      - 'DO_TOKEN=dop_v1_<<hex:64>>'
    nomatch:
      - 'dop_v1_<<hex:20>>'
