# AI and model providers.

- id: anthropic-api-key
  label: Anthropic API key
  category: ai
  confidence: high
  keywords: [sk-ant-]
  pattern: '\b(sk-ant-[A-Za-z0-9_\-]{32,200})'
  placeholder: ANTHROPIC_API_KEY
  description: Known Anthropic format (sk-ant-)
  tests:
    match:
      - 'ANTHROPIC_API_KEY=sk-ant-api03-<<urlsafe:93>>AA'
    nomatch:
      - 'sk-ant-<<alnum:10>>'

- id: openai-api-key
  label: OpenAI API key
  category: ai
  confidence: high
  keywords: [sk-proj-, sk-svcacct-, sk-admin-]
  pattern: '\b(sk-(?:proj|svcacct|admin)-[A-Za-z0-9_\-]{40,250})'
  placeholder: OPENAI_API_KEY
  description: Known OpenAI format (sk-proj-, sk-svcacct- or sk-admin-)
  tests:
    match:
      - 'client = OpenAI(api_key="sk-proj-<<urlsafe:120>>")'
    nomatch:
      - 'sk-proj-<<alnum:10>>'

- id: openai-legacy-key
  label: OpenAI API key (legacy)
  category: ai
  confidence: high
  keywords: [t3blbkfj]
  pattern: '\b(sk-[A-Za-z0-9]{20}T3BlbkFJ[A-Za-z0-9]{20})\b'
  placeholder: OPENAI_API_KEY
  description: Older OpenAI format (contains T3BlbkFJ, which is "OpenAI" in base64)
  tests:
    match:
      - 'openai.api_key = "sk-<<alnum:20>>T3BlbkFJ<<alnum:20>>"'
    nomatch:
      - 'sk-<<alnum:20>>T3BlbkFJ'

- id: sk-style-api-key
  label: API key (sk- format)
  category: ai
  confidence: medium
  generic: true
  keywords: [sk-]
  pattern: '\b(sk-[A-Za-z0-9]{32,64})\b'
  minEntropy: 3.5
  placeholder: API_KEY
  description: Many AI providers use sk- keys (DeepSeek, Moonshot and others)
  tests:
    match:
      - 'DEEPSEEK_API_KEY=sk-<<alnum:32>>'
    nomatch:
      - 'sk-<<alnum:10>>'
      - 'task-<<alnum:40>>'

- id: huggingface-token
  label: Hugging Face token
  category: ai
  confidence: high
  keywords: [hf_]
  pattern: '\b(hf_[A-Za-z0-9]{34,40})\b'
  minEntropy: 3.5
  placeholder: HF_TOKEN
  description: Known Hugging Face format (hf_ plus 34 or more characters)
  tests:
    match:
      - 'HF_TOKEN=hf_<<alnum:34>>'
    nomatch:
      - 'hf_<<alnum:10>>'

- id: groq-api-key
  label: Groq API key
  category: ai
  confidence: high
  keywords: [gsk_]
  pattern: '\b(gsk_[A-Za-z0-9]{52})\b'
  placeholder: GROQ_API_KEY
  description: Known Groq format (gsk_ plus 52 characters)
  tests:
    match:
      - 'GROQ_API_KEY=gsk_<<alnum:52>>'
    nomatch:
      - 'gsk_<<alnum:20>>'

- id: replicate-token
  label: Replicate API token
  category: ai
  confidence: high
  keywords: [r8_]
  pattern: '\b(r8_[A-Za-z0-9]{37})\b'
  placeholder: REPLICATE_TOKEN
  description: Known Replicate format (r8_ plus 37 characters)
  tests:
    match:
      - 'REPLICATE_API_TOKEN=r8_<<alnum:37>>'
    nomatch:
      - 'r8_<<alnum:10>>'
