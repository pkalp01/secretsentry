# Payment providers.

- id: stripe-live-key
  label: Stripe live secret key
  category: payments
  confidence: high
  keywords: [sk_live_, rk_live_]
  pattern: '\b((?:sk|rk)_live_[A-Za-z0-9]{24,99})\b'
  placeholder: STRIPE_SECRET_KEY
  description: Known Stripe live-mode format (sk_live_ or rk_live_). Can move real money
  tests:
    match:
      - 'STRIPE_SECRET_KEY=sk_live_<<alnum:24>>'
      - 'stripe.api_key = "rk_live_<<alnum:40>>"'
    nomatch:
      - 'sk_live_<<alnum:10>>'
      - 'pk_live_<<alnum:24>>'

- id: stripe-test-key
  label: Stripe test secret key
  category: payments
  confidence: medium
  keywords: [sk_test_, rk_test_]
  pattern: '\b((?:sk|rk)_test_[A-Za-z0-9]{24,99})\b'
  placeholder: STRIPE_TEST_KEY
  description: Stripe test-mode key. No real money, but it still unlocks your Stripe account data
  tests:
    match:
      - 'sk_test_<<alnum:24>>'
    nomatch:
      - 'sk_test_<<alnum:8>>'

- id: square-token
  label: Square access token
  category: payments
  confidence: high
  keywords: [sq0atp-, sq0csp-]
  pattern: '\b(sq0(?:atp|csp)-[A-Za-z0-9_\-]{22,43})(?![A-Za-z0-9_\-])'
  placeholder: SQUARE_TOKEN
  description: Known Square format (sq0atp- or sq0csp-)
  tests:
    match:
      - 'SQUARE_TOKEN=sq0atp-<<urlsafe:22>>'
    nomatch:
      - 'sq0atp-<<urlsafe:10>>'

- id: braintree-token
  label: Braintree production token
  category: payments
  confidence: high
  keywords: [access_token$production$]
  pattern: '(access_token\$production\$[a-z0-9]{16}\$[a-f0-9]{32})'
  placeholder: BRAINTREE_TOKEN
  description: Known Braintree production access token format
  tests:
    match:
      - 'access_token$production$<<digits:16>>$<<hex:32>>'
    nomatch:
      - 'access_token$sandbox$<<digits:16>>$<<hex:32>>'
