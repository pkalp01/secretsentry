# Credentials in connection strings, and secrets assigned to secret-like names.

- id: url-credentials
  label: Password in a connection URL
  category: database
  confidence: high
  keywords: ['://']
  flags: i
  pattern: '\b[a-z][a-z0-9+.\-]{1,20}://[^\s:/@]{1,256}:([^\s@/]{3,256})@[^\s/]'
  placeholder: URL_PASSWORD
  description: A password inside a user:password@host connection string
  tests:
    match:
      - 'DATABASE_URL=postgres://app:<<alnum:16>>@db.internal:5432/app'
      - 'mongodb+srv://admin:<<alnum:12>>@cluster0.mongodb.net/test'
    nomatch:
      - 'postgres://user:password@localhost/db'
      - 'https://example.com/path'

- id: generic-secret-assignment
  label: Secret assigned to a variable
  category: generic
  confidence: medium
  generic: true
  keywords: [key, secret, token, passw, pwd, auth, credential]
  flags: i
  pattern: '(?<![A-Za-z0-9])((?:[A-Za-z0-9]{1,30}[_\-.]){0,4}(?:api[_\-.]?key|apikey|secret|token|passw(?:or)?d|pwd|auth|credentials?|private[_\-.]?key|access[_\-.]?key)(?:[_\-.][A-Za-z0-9]{1,30}){0,4})["''`]?\s*(?:=|:=|:|=>|->)\s*["''`]?([^\s"''`,;(){}\[\]<>]{8,256})'
  group: 2
  nameGroup: 1
  minEntropy: 3.0
  placeholder: SECRET
  description: Random-looking value assigned to a secret-like name
  tests:
    match:
      - 'MY_SERVICE_API_KEY=<<alnum:32>>'
      - '"client_secret": "<<urlsafe:40>>"'
      - 'db_password: "Tr0ub4dor&3x!"'
    nomatch:
      - 'api_key = os.getenv("API_KEY")'
      - 'token = response.data.token'
      - 'secret_name = "prod-db-credentials"'
      - 'password: "your_password_here"'
      - 'auth = HTTPBasicAuth(user, pw)'
      - 'max_tokens = 4096'
      - 'author: Jane Smith'
