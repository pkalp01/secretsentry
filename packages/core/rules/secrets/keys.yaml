# Private keys and auth headers.

- id: private-key
  label: Private key
  category: keys
  confidence: high
  keywords: [private key]
  pattern: '(-----BEGIN[ A-Z0-9]{0,40}PRIVATE KEY(?: BLOCK)?-----(?:[\s\S]{0,12000}?-----END[ A-Z0-9]{0,40}PRIVATE KEY(?: BLOCK)?-----)?)'
  placeholder: PRIVATE_KEY
  description: Begins with a private key header (SSH, TLS, PGP)
  tests:
    match:
      - "-----BEGIN OPENSSH PRIVATE KEY-----\n<<b64:64>>\n<<b64:64>>\n-----END OPENSSH PRIVATE KEY-----"
      - "-----BEGIN RSA PRIVATE KEY-----\n<<b64:64>>"
      - "-----BEGIN PGP PRIVATE KEY BLOCK-----"
    nomatch:
      - "-----BEGIN PUBLIC KEY-----\n<<b64:64>>\n-----END PUBLIC KEY-----"
      - "-----BEGIN CERTIFICATE-----"

- id: jwt
  label: JSON Web Token
  category: tokens
  confidence: high
  keywords: [eyj]
  pattern: '\b(eyJ[A-Za-z0-9_\-]{10,4000}\.eyJ[A-Za-z0-9_\-]{10,8000}\.[A-Za-z0-9_\-]{10,4000})'
  placeholder: JWT
  description: A signed login or session token (three base64 parts starting with eyJ)
  tests:
    match:
      - 'Cookie: session=eyJ<<urlsafe:30>>.eyJ<<urlsafe:60>>.<<urlsafe:43>>'
    nomatch:
      - 'eyJ<<urlsafe:30>>'

- id: basic-auth-header
  label: Basic auth credentials
  category: tokens
  confidence: high
  keywords: [basic]
  flags: i
  pattern: 'Authorization["'']?\s*[:=]\s*["'']?Basic\s+([A-Za-z0-9+/]{12,1000}={0,2})'
  minEntropy: 3.0
  placeholder: BASIC_AUTH
  description: A username and password encoded in an Authorization header
  tests:
    match:
      - 'Authorization: Basic <<b64:24>>=='
    nomatch:
      - 'Authorization: Basic'

- id: bearer-token
  label: Bearer token
  category: tokens
  confidence: medium
  generic: true
  keywords: [bearer]
  flags: i
  pattern: '\bBearer\s+([A-Za-z0-9._~+/\-]{20,2000}=*)'
  minEntropy: 3.5
  placeholder: BEARER_TOKEN
  description: A token sent in an Authorization header
  tests:
    match:
      - 'curl -H "Authorization: Bearer <<urlsafe:40>>" https://api.example.com'
    nomatch:
      - 'headers={"Authorization": f"Bearer {API_KEY}"}'
      - 'Bearer <<alnum:8>>'
