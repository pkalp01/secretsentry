name: Missed a secret
description: SecretSentry didn't warn about something that is a real secret.
title: "[Missed secret] "
labels: ["detection", "missed secret"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste a real key, token or password here.** Revoke any real secret you shared, then describe a made-up example in the same format.
  - type: input
    id: service
    attributes:
      label: Which service is the secret for?
      placeholder: e.g. Cloudflare API token
    validations:
      required: true
  - type: textarea
    id: format
    attributes:
      label: What does the format look like?
      description: Describe the prefix, length and characters, or give a FAKE example. Link to the provider's docs if you can.
      placeholder: "Starts with cf_, then 40 letters and digits. Fake example: cf_AbCdEf..."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: How was it written in the message?
      description: For example on its own, after API_KEY=, inside JSON or in a URL. Use fake values.
  - type: input
    id: version
    attributes:
      label: SecretSentry version
      description: Shown in the toolbar popup.
      placeholder: "0.1.0"
  - type: checkboxes
    id: confirm
    attributes:
      label: Check before submitting
      options:
        - label: This report contains no real secrets.
          required: true
